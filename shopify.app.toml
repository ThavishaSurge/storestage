# ThemeMerge — Shopify app configuration.
# Run `npm run config:link` to link this file to your app in the Partner / Dev Dashboard;
# the CLI fills in client_id, name, application_url and redirect URLs.
client_id = "47e6063c0a7f1580cdfcc45b0232763b"
name = "ThemeMerge"
application_url = "https://storestage-production.up.railway.app"
embedded = true

[auth]
redirect_urls = [
  "https://storestage-production.up.railway.app/auth/callback",
  "https://storestage-production.up.railway.app/auth/shopify/callback",
  "https://storestage-production.up.railway.app/api/auth/callback"
]

[build]
# Keep `shopify app dev` from rewriting application_url to a temporary tunnel URL.
automatically_update_urls_on_dev = false

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
#
# write_themes: theme WRITES (themeFilesUpsert / themeFilesDelete) additionally need Shopify's
# "Online Store Protected Scope Exemption". Reading theme files works without it.
# The app keeps all theme writes behind THEME_WRITES_ENABLED until the exemption is granted.
scopes = "read_themes,write_themes"

[webhooks]
api_version = "2026-10"

  # Handled by: /app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  # Handled by: /app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  # Mandatory compliance topics for public apps.
  # Handled by: /app/routes/webhooks.compliance.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
