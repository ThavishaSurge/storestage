# StoreStage — Shopify app configuration.
# Run `npm run config:link` to link this file to your app in the Partner / Dev Dashboard;
# the CLI fills in client_id, name, application_url and redirect URLs.
client_id = ""
name = "StoreStage"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
#
# write_themes: theme WRITES (themeFilesUpsert / themeFilesDelete) additionally need Shopify's
# "Online Store Protected Scope Exemption". Reading theme files works without it.
# The app keeps all theme writes behind THEME_WRITES_ENABLED until the exemption is granted.
scopes = "read_themes,write_themes,read_products,write_products,read_content,write_content,read_online_store_navigation,write_online_store_navigation,read_files,write_files,read_metaobjects,write_metaobjects,read_metaobject_definitions,write_metaobject_definitions,read_publications,write_publications"

[webhooks]
api_version = "2026-10"

  # Handled by: /app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  # Handled by: /app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  # Mandatory compliance topics for public apps.
  # Handled by: /app/routes/webhooks.compliance.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
